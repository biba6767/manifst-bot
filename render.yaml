services:
  - type: worker
    name: manifest-bot
    runtime: python
    region: frankfurt
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    envVars:
      - key: API_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        value: "@manifestvelo"
      - key: TELEGRAM_PAYMENT_PROVIDER_TOKEN
        sync: false
